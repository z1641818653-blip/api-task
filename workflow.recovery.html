<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow</title>
<style>
:root {
  --bg: #f5f0ff;
  --surface: #ffffff;
  --surface2: #f0ebf8;
  --text: #2d1b4e;
  --text2: #6b5b8a;
  --border: #d4c8e8;
  --primary: #6d3fc0;
  --primary-hover: #5a2fa8;
  --shadow: 0 2px 8px rgba(109,63,192,0.08);
  --radius: 10px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
  --success: #2ecc71;
  --danger: #e74c3c;
  --warning: #f39c12;
  --info: #3498db;
}
[data-theme="dark"] {
  --bg: #1a1428;
  --surface: #241e38;
  --surface2: #2d2548;
  --text: #e0d8f0;
  --text2: #a898c8;
  --border: #3a2d58;
  --primary: #8b6fd8;
  --primary-hover: #9d82e8;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased
}
.layout{display:flex;height:100vh;position:relative}

/* LEFT PANEL */
.panel-left{
  width:260px;min-width:260px;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  transition:width .3s ease,min-width .3s ease,opacity .3s ease,padding .3s ease;
  overflow:hidden;position:relative;z-index:10
}
.panel-left.collapsed{padding:0;opacity:0;border:none;overflow:hidden}
.panel-left .header{
  padding:16px 18px 12px;font-size:13px;font-weight:700;color:var(--text);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px
}
.panel-left .body{flex:1;overflow-y:auto;padding:12px 14px;min-height:0}

/* CENTER */
.panel-center{
  flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;
  background:var(--bg);position:relative;z-index:5
}
.panel-center .top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;min-height:42px
}
.panel-center .top-bar h2{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.panel-center .top-bar .title-display{font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right}
.menu-btn{background:transparent;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:3px 6px;border-radius:6px;line-height:1;transition:background .15s,color .15s;flex-shrink:0}
.menu-btn:hover{background:var(--surface2);color:var(--primary)}
.menu-dropdown{position:absolute;top:100%;left:8px;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px;display:none;min-width:160px}
.menu-dropdown.show{display:block}
.menu-dropdown a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--text);text-decoration:none;transition:background .15s}
.menu-dropdown a:hover{background:var(--surface2);color:var(--primary)}
.menu-dropdown .menu-label{font-size:10px;color:var(--text2);padding:4px 12px 2px;font-weight:600}
.panel-center .content{
  flex:1;overflow-y:auto;padding:16px 20px;min-height:0;
  display:flex;flex-direction:column;gap:10px
}
.panel-center .bottom-bar{
  padding:8px 20px;background:var(--surface);
  border-top:1px solid var(--border);flex-shrink:0;font-size:11px;color:var(--text2)
}

/* RIGHT PANEL */
.panel-right{
  width:300px;min-width:300px;background:var(--surface);
  border-left:1px solid var(--border);display:flex;flex-direction:column;
  transition:width .3s ease,min-width .3s ease,opacity .3s ease,padding .3s ease;
  overflow:hidden;position:relative;z-index:10
}
.panel-right.collapsed{padding:0;opacity:0;border:none;overflow:hidden}
.panel-right .header{
  padding:16px 18px 12px;font-size:13px;font-weight:700;color:var(--text);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px
}
.panel-right .body{flex:1;overflow-x:auto;overflow-y:auto;padding:12px 8px;min-height:0;display:flex;flex-direction:column;align-items:center}

/* RESIZE HANDLE */
.resize-handle{
  position:absolute;top:0;bottom:0;left:-4px;width:8px;
  cursor:col-resize;z-index:50;background:transparent;transition:background .15s
}
.resize-handle:hover,.resize-handle.active{background:var(--primary);opacity:.2}
.panel-right.dragging{user-select:none;pointer-events:none;transition:none!important}

/* FLOATING COLLAPSE BUTTON */
.floating-btn{
  position:absolute;top:50%;z-index:100;width:20px;height:40px;
  transform:translateY(-50%);display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:1px solid var(--border);background:var(--surface);
  color:var(--text2);font-size:9px;box-shadow:0 2px 8px rgba(0,0,0,.1);
  transition:background .15s;
}
.floating-btn:hover{background:var(--surface2);color:var(--primary)}
#collapseBtnLeft{left:260px;border-radius:0 6px 6px 0;border-left:none}
#collapseBtnRight{right:300px;border-radius:6px 0 0 6px;border-right:none}

/* THEME TOGGLE */
.theme-toggle{
  margin-top:auto;padding:10px 14px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);cursor:pointer;flex-shrink:0
}
.theme-toggle:hover{color:var(--primary)}

/* FORM ELEMENTS */
.form-group{margin-bottom:10px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;letter-spacing:.02em}
.form-input,.form-select,.form-textarea{
  width:100%;padding:7px 10px;font-size:12px;font-family:inherit;color:var(--text);
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  outline:none;transition:border-color var(--transition)
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:48px;line-height:1.5}
.form-textarea.mono{font-family:'SF Mono','Menlo','Consolas',monospace;font-size:11px}
.form-input.number{width:80px}
.form-row{display:flex;gap:10px;align-items:center}
.form-row>*{flex:1}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:4px;padding:6px 14px;font-size:12px;font-weight:600;
  border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;
  background:var(--surface);color:var(--text);font-family:inherit;transition:all var(--transition);
  white-space:nowrap
}
.btn:hover{background:var(--surface2);border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover);color:#fff}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* COLOR PICKER */
.color-picker{display:flex;gap:4px;flex-wrap:wrap}
.color-btn{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
  cursor:pointer;transition:all var(--transition);position:relative;flex-shrink:0
}
.color-btn:hover{transform:scale(1.15)}
.color-btn.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.color-btn.none{background:var(--surface2);border-style:dashed}
.color-btn.red{background:#e74c3c}
.color-btn.orange{background:#e67e22}
.color-btn.yellow{background:#f1c40f}
.color-btn.green{background:#2ecc71}
.color-btn.blue{background:#3498db}
.color-btn.purple{background:#9b59b6}

/* STATUS BADGE */
.status-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 10px;
  border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2)
}
.status-badge.pending{color:var(--text2)}
.status-badge.running{color:var(--info);border-color:var(--info)}
.status-badge.done{color:var(--success);border-color:var(--success)}
.status-badge.error{color:var(--danger);border-color:var(--danger)}

/* ERROR MESSAGE */
.error-msg{
  font-size:11px;color:var(--danger);padding:6px 10px;background:rgba(231,76,60,.08);
  border:1px solid rgba(231,76,60,.2);border-radius:var(--radius-sm);display:none
}
.error-msg.show{display:block}

/* TREE */
.tree{text-align:center;padding:10px 0;display:inline-block;min-width:100%}
.tree ul{display:flex;padding-top:20px;position:relative;justify-content:center;list-style:none;margin:0;padding-left:0}
.tree li{display:flex;flex-direction:column;align-items:center;position:relative;padding:0 4px;flex:0 0 auto}
.tree li::before{content:'';position:absolute;top:-20px;left:50%;width:0;height:20px;border-left:2px solid var(--border)}
.tree ul::before{content:'';position:absolute;top:0;left:5%;width:90%;height:0;border-top:2px solid var(--border)}
.tree>ul{padding-top:0}
.tree>ul::before{display:none}
.tree>ul>li::before{display:none}
.t-node{background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:2px 6px;cursor:pointer;text-align:center;min-width:40px;max-width:90px;transition:all .15s;position:relative;display:flex;align-items:center;gap:2px;font-size:10px;flex-shrink:0}
.t-node:hover{border-color:var(--primary)}
.t-node.selected{border-color:var(--primary);background:rgba(109,63,192,0.06)}
.t-node.color-red{border-left:4px solid #ef4444}
.t-node.color-orange{border-left:4px solid #f97316}
.t-node.color-yellow{border-left:4px solid #eab308}
.t-node.color-green{border-left:4px solid #22c55e}
.t-node.color-blue{border-left:4px solid #3b82f6}
.t-node.color-purple{border-left:4px solid #8b5cf6}
.node-drag{font-size:10px;opacity:.4;cursor:grab;user-select:none;line-height:1}
.node-drag:hover{opacity:1}
.node-num{font-size:9px;font-weight:700;color:var(--primary);white-space:nowrap}
.node-title{font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50px;display:inline-block}
.node-status{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%}
.node-status.pending{background:#9ca3af}
.node-status.running{background:#f59e0b;animation:pulse .8s infinite}
.node-status.done{background:#10b981}
.node-status.failed{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.t-node.locked{opacity:.7;background:var(--surface2)}
.t-node.locked .node-drag{opacity:.2;cursor:default}

/* TREE BUTTONS */
.tree-buttons{
  padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:4px;flex-wrap:wrap;
  background:var(--surface);flex-shrink:0
}
.tree-buttons .btn{flex:1;min-width:0;justify-content:center;padding:5px 6px;font-size:11px}

/* TOAST */
.toast-container{
  position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none
}
.toast{
  pointer-events:auto;padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;
  box-shadow:0 4px 12px rgba(0,0,0,.12);color:#fff;animation:slideIn .25s ease;max-width:300px;
  transition:opacity .25s,transform .25s
}
.toast.info{background:var(--info)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}
.toast.removing{opacity:0;transform:translateX(20px)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* CONTEXT MENU */
.context-menu{
  position:fixed;z-index:9998;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;min-width:120px;
  overflow:hidden
}
.context-menu .ctx-item{
  padding:8px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;
  color:var(--text);transition:background var(--transition)
}
.context-menu .ctx-item:hover{background:var(--surface2);color:var(--primary)}
.context-menu .ctx-divider{height:1px;background:var(--border);margin:2px 0}

/* PLACEHOLDER */
.placeholder{color:var(--text2);font-size:13px;text-align:center;opacity:.6;padding:40px 20px}

/* MISC */
.flex-center{display:flex;align-items:center;justify-content:center}
.gap-sm{gap:6px}
.text-muted{color:var(--text2)}
.text-sm{font-size:11px}
.mt-auto{margin-top:auto}
.w-full{width:100%}

/* OUTPUT TEXTAREA */
.output-area{flex:1;min-height:0;display:flex;flex-direction:column}
.output-area .form-textarea{flex:1;min-height:60px;resize:none}

/* WORKFLOW LIST */
.wf-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);transition:background .15s}
.wf-item:hover{background:var(--surface2)}
.wf-item.active{background:var(--surface2);color:var(--primary);font-weight:600}
.wf-item .wf-del{opacity:0;margin-left:auto;cursor:pointer;font-size:10px;color:var(--text2);padding:2px 4px;border-radius:3px}
.wf-item:hover .wf-del{opacity:1}
.wf-item .wf-del:hover{background:rgba(239,68,68,0.12);color:var(--danger)}
</style>
</head>
<body>
<div class="layout" id="layout">

  <!-- LEFT -->
  <aside class="panel-left" id="panelLeft">
    <div class="header" style="cursor:pointer;user-select:none" id="navHeader">🧭 AI 工具 <span style="margin-left:auto;font-size:10px;color:var(--text2)" id="navArrow">▼</span></div>
    <div class="body" id="navBody" style="padding:8px 14px 4px">
      <a href="index.html" style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--text);text-decoration:none;transition:background .15s">🏠 AI 灵境</a>
      <a href="chat.html" style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--text);text-decoration:none;transition:background .15s">💬 AI 工作台</a>
      <a href="chatroom.html" style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--text);text-decoration:none;transition:background .15s">👥 AI 聊天室</a>
      <a href="workflow.html" style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--primary);text-decoration:none;font-weight:600">🌳 AI 流程树</a>
      <a href="mdtest.html" style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--text);text-decoration:none;transition:background .15s">📝 Markdown 测试</a>
    </div>
    <div class="header" style="cursor:pointer;user-select:none;border-top:1px solid var(--border)" id="wfListHeader">📂 流程列表 <span style="margin-left:auto;font-size:10px;color:var(--text2)" id="wfListArrow">▼</span></div>
    <div id="wfListBody" style="padding:4px 0">
      <div id="wfListContainer"></div>
      <button id="btnNewWorkflow" style="width:100%;padding:6px;margin-top:4px;border-radius:8px;border:1px dashed var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;font-weight:600">➕ 新建流程</button>
    </div>
    <div class="header">⚙️ 设置</div>
    <div class="body" id="settingsBody"></div>
    <div class="theme-toggle" id="themeToggle">🌙 暗色模式</div>
  </aside>
  <button class="floating-btn" id="collapseBtnLeft" title="切换左侧栏">◀</button>

  <!-- CENTER -->
  <main class="panel-center">
    <div class="top-bar" id="topBar">
      <input id="wfNameInput" style="border:none;background:transparent;color:var(--text);font-size:14px;font-weight:700;outline:none;flex:1;min-width:60px;font-family:inherit" placeholder="流程名称">
      <span id="nodePath" style="font-size:11px;color:var(--text2);white-space:nowrap">📌 节点</span>
      <span class="title-display" id="nodeTitleDisplay"></span>
    </div>
    <div class="content" id="workspaceContent"></div>
    <div class="bottom-bar" id="bottomBar"></div>
  </main>

  <button class="floating-btn" id="collapseBtnRight" title="切换右侧栏">▶</button>

  <!-- RIGHT -->
  <aside class="panel-right" id="panelRight">
    <div class="resize-handle" id="resizeHandle"></div>
    <div class="header">🌳 流程控制</div>
    <div class="body" id="treeBody"><div id="treeContainer"></div></div>
    <div class="tree-buttons" id="treeButtons">
      <button class="btn btn-sm" data-action="addChild">➕ 添加子节点</button>
      <button class="btn btn-sm btn-danger" data-action="deleteNode">✕ 删除</button>
      <button class="btn btn-sm" data-action="copyNode">📋 复制</button>
      <button class="btn btn-sm" data-action="pasteNode">📥 粘贴</button>
    </div>
  </aside>

</div>

<div class="toast-container" id="toastContainer"></div>
<div class="confirm-overlay" id="confirmOverlay" style="display:none;position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);align-items:center;justify-content:center">
  <div style="background:var(--surface);border-radius:12px;padding:20px;min-width:260px;max-width:360px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.15)">
    <p id="confirmMsg" style="font-size:14px;margin-bottom:16px;line-height:1.5;color:var(--text)"></p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button id="confirmNo" style="padding:7px 20px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:13px;cursor:pointer;font-weight:600">取消</button>
      <button id="confirmYes" style="padding:7px 20px;border-radius:12px;border:1px solid var(--danger);background:transparent;color:var(--danger);font-size:13px;cursor:pointer;font-weight:600">确认</button>
    </div>
  </div>
</div>
<div class="context-menu" id="contextMenu"></div>

<script>
// ── State ──
let workflows = [];
let activeWorkflowId = null;
let selectedNodeId = null;
let copiedNode = null;
let abortController = null;
let isRunning = false;
let runQueue = [];
let runIndex = 0;
let providerState = { provider: 'DeepSeek', model: '', apiKey: '' };

function createNode(title, opts) {
  return {
    id: 'n' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    title: title || '',
    prompt: '',
    inputType: 'manual',
    inheritFrom: null,
    manualInput: '',
    output: '',
    status: 'pending',
    error: '',
    maxTokens: 4000,
    temperature: 0.3,
    color: '',
    children: [],
    _parentId: null,
    _collapsed: false,
    locked: false,
    ...opts
  };
}

const WORKFLOW_EXPORT_SCHEMA = 'linjin.workflow';
const WORKFLOW_EXPORT_VERSION = 2;
const MAX_IMPORT_BYTES = 5 * 1024 * 1024;
const MAX_IMPORT_NODES = 5000;

function parseStoredJson(raw, fallback, label, backupKey) {
  if (!raw) return fallback;
  try {
    return JSON.parse(raw);
  } catch (err) {
    console.warn((label || 'JSON') + ' 解析失败:', err);
    if (backupKey && typeof localStorage !== 'undefined') {
      try { localStorage.setItem(backupKey, raw); } catch (backupErr) {}
    }
    return fallback;
  }
}

function normalizeNodeData(node, parentId, seenIds, counter) {
  if (!node || typeof node !== 'object' || Array.isArray(node)) node = createNode('新节点');
  seenIds = seenIds || new Set();
  counter = counter || { count: 0 };
  counter.count += 1;
  if (counter.count > MAX_IMPORT_NODES) throw new Error('节点数量超过上限 ' + MAX_IMPORT_NODES);

  if (typeof node.id !== 'string' || !node.id || seenIds.has(node.id)) node.id = createNode('').id;
  seenIds.add(node.id);
  node.title = typeof node.title === 'string' ? node.title : '';
  node.prompt = typeof node.prompt === 'string' ? node.prompt : '';
  node.inputType = typeof node.inputType === 'string' && node.inputType ? node.inputType : 'manual';
  node.inheritFrom = typeof node.inheritFrom === 'string' && node.inheritFrom ? node.inheritFrom : null;
  node.manualInput = typeof node.manualInput === 'string' ? node.manualInput : '';
  node.output = typeof node.output === 'string' ? node.output : '';
  node.status = typeof node.status === 'string' && node.status ? node.status : 'pending';
  if (node.status === 'running') node.status = 'pending';
  node.error = typeof node.error === 'string' ? node.error : '';
  node.maxTokens = Number.isFinite(Number(node.maxTokens)) && Number(node.maxTokens) > 0 ? Number(node.maxTokens) : 4000;
  node.temperature = Number.isFinite(Number(node.temperature)) ? Number(node.temperature) : 0.3;
  node.color = typeof node.color === 'string' ? node.color : '';
  node._collapsed = node._collapsed === true;
  node.locked = node.locked === true;
  node._parentId = parentId;
  node.children = Array.isArray(node.children) ? node.children.filter(function(child) {
    return child && typeof child === 'object' && !Array.isArray(child);
  }) : [];
  node.children = node.children.map(function(child) {
    return normalizeNodeData(child, node.id, seenIds, counter);
  });
  return node;
}

function normalizeWorkflowData(wf, index) {
  if (!wf || typeof wf !== 'object' || Array.isArray(wf)) return null;
  if (typeof wf.id !== 'string' || !wf.id) wf.id = 'wf_' + Date.now() + '_' + (index || 0) + '_' + Math.random().toString(36).slice(2,6);
  wf.title = typeof wf.title === 'string' && wf.title ? wf.title : '未命名流程';
  wf.createdAt = typeof wf.createdAt === 'string' ? wf.createdAt : new Date().toISOString();
  wf.updatedAt = typeof wf.updatedAt === 'string' ? wf.updatedAt : wf.createdAt;
  if (!wf.tree || typeof wf.tree !== 'object' || Array.isArray(wf.tree)) wf.tree = createNode('流程根节点');
  wf.tree = normalizeNodeData(wf.tree, null, new Set(), { count: 0 });
  ensureMainNode(wf);
  return wf;
}

function normalizeWorkflowList(list) {
  if (!Array.isArray(list)) return [];
  return list.map(function(wf, index) { return normalizeWorkflowData(wf, index); }).filter(Boolean);
}

function buildWorkflowExport(wf) {
  wf = normalizeWorkflowData(wf, 0);
  if (!wf) throw new Error('当前流程无效');
  return {
    schema: WORKFLOW_EXPORT_SCHEMA,
    version: WORKFLOW_EXPORT_VERSION,
    exportedAt: new Date().toISOString(),
    workflow: {
      title: wf.title,
      createdAt: wf.createdAt,
      updatedAt: wf.updatedAt,
      tree: JSON.parse(JSON.stringify(wf.tree))
    },
    provider: {
      provider: providerState.provider,
      model: providerState.model
    }
  };
}

function readWorkflowImport(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('导入文件必须是 JSON 对象');
  if (data.schema && data.schema !== WORKFLOW_EXPORT_SCHEMA) throw new Error('不支持的流程文件类型');
  if (data.version && Number(data.version) > WORKFLOW_EXPORT_VERSION) throw new Error('流程文件版本过新，请升级页面后再导入');

  var source = data.workflow && typeof data.workflow === 'object' ? data.workflow : data;
  if (!source.tree || typeof source.tree !== 'object' || Array.isArray(source.tree)) throw new Error('导入文件缺少有效的 tree');
  return {
    title: typeof source.title === 'string' ? source.title : null,
    createdAt: typeof source.createdAt === 'string' ? source.createdAt : null,
    updatedAt: typeof source.updatedAt === 'string' ? source.updatedAt : null,
    tree: source.tree,
    provider: data.provider && typeof data.provider === 'object' ? data.provider : null
  };
}

function applyWorkflowImport(wf, data) {
  if (!wf) throw new Error('当前没有可导入的流程');
  var imported = readWorkflowImport(data);
  wf.tree = imported.tree;
  if (imported.title) wf.title = imported.title;
  if (imported.createdAt) wf.createdAt = imported.createdAt;
  wf.updatedAt = new Date().toISOString();
  normalizeWorkflowData(wf, 0);

  if (imported.provider) {
    if (typeof imported.provider.provider === 'string' && imported.provider.provider &&
        (typeof PROVIDERS === 'undefined' || Object.prototype.hasOwnProperty.call(PROVIDERS, imported.provider.provider))) {
      providerState.provider = imported.provider.provider;
    }
    if (typeof imported.provider.model === 'string') providerState.model = imported.provider.model;
  }
  return ensureMainNode(wf);
}

function getActiveWorkflow(){return workflows.find(w=>w.id===activeWorkflowId);}

function getMainNode(wf) {
  if (!wf || !wf.tree || !Array.isArray(wf.tree.children)) return null;
  return wf.tree.children.find(function(n) { return n && n._isMainNode === true; }) || wf.tree.children[0] || null;
}

function ensureMainNode(wf) {
  if (!wf) return null;
  if (!wf.tree || typeof wf.tree !== 'object') wf.tree = createNode('流程根节点');
  if (!Array.isArray(wf.tree.children)) wf.tree.children = [];
  var mainNode = getMainNode(wf);
  if (!mainNode) {
    mainNode = createNode('主任务');
    wf.tree.children.unshift(mainNode);
  } else {
    var mainIndex = wf.tree.children.indexOf(mainNode);
    if (mainIndex > 0) {
      wf.tree.children.splice(mainIndex, 1);
      wf.tree.children.unshift(mainNode);
    }
  }
  mainNode._isMainNode = true;
  mainNode.locked = false;
  if (!mainNode.title) mainNode.title = '主任务';
  (function clearDuplicateMainMarkers(node) {
    if (!node || !Array.isArray(node.children)) return;
    node.children.forEach(function(child) {
      if (child !== mainNode && child && child._isMainNode === true) delete child._isMainNode;
      clearDuplicateMainMarkers(child);
    });
  })(wf.tree);
  updateParentRefs(wf.tree, null);
  return mainNode;
}

function isMainNode(wf, nodeOrId) {
  if (!wf || !nodeOrId) return false;
  var node = typeof nodeOrId === 'string' ? findNode(wf.tree, nodeOrId) : nodeOrId;
  if (!node) return false;
  var mainNode = getMainNode(wf);
  return node._isMainNode === true || !!(mainNode && mainNode.id === node.id);
}

// ── Tree operations ──
function findNode(root, id) {
  if (!root) return null;
  if (root.id === id) return root;
  for (const c of root.children) {
    const found = findNode(c, id);
    if (found) return found;
  }
  return null;
}

function findParent(root, id, parent) {
  if (!root) return null;
  if (root.id === id) return parent;
  for (const c of root.children) {
    const found = findParent(c, id, root);
    if (found) return found;
  }
  return null;
}

function getAncestors(root, id, acc) {
  acc = acc || [];
  if (!root) return acc;
  if (root.id === id) return acc;
  for (const c of root.children) {
    if (findNode(c, id)) {
      acc.push(root);
      return getAncestors(c, id, acc);
    }
  }
  return acc;
}

function getPathIdx(root, id) {
  const path = [];
  (function walk(node, indices) {
    if (node.id === id) { path.push(...indices); return true; }
    for (let i = 0; i < node.children.length; i++) {
      if (walk(node.children[i], [...indices, i])) return true;
    }
    return false;
  })(root, []);
  return path;
}

function getNodePath(root, id) {
  const idx = getPathIdx(root, id);
  return idx.map(i => i + 1).join('.');
}

function updateParentRefs(node, parentId) {
  if (!node || typeof node !== 'object') return;
  if (!Array.isArray(node.children)) node.children = [];
  node._parentId = parentId;
  for (const c of node.children) updateParentRefs(c, node.id);
}

function addChild(parentId, title) {
  var wf = getActiveWorkflow();
  if (!wf) return null;
  ensureMainNode(wf);
  const parent = findNode(wf.tree, parentId);
  if (!parent) return null;
  const node = createNode(title || '新节点');
  node._parentId = parentId;
  parent.children.push(node);
  saveState();
  renderAll();
  return node.id;
}

function hasLockedDescendant(node) {
  if (node.locked) return true;
  for (const c of node.children) {
    if (hasLockedDescendant(c)) return true;
  }
  return false;
}
function deleteNode(nodeId) {
  var wf = getActiveWorkflow();
  if (!wf) return;
  const mainNode = ensureMainNode(wf);
  const node = findNode(wf.tree, nodeId);
  if (!node) return;
  if (isMainNode(wf, node)) { showToast('主节点是流程锚点，不能删除', 'warning'); return; }
  if (node.locked) { showToast('锁定节点不能删除', 'warning'); return; }
  if (hasLockedDescendant(node)) {
    showConfirm('该节点下存在锁定子节点，确定全部删除吗？', function() {
      doDeleteNode(nodeId);
    });
    return;
  }
  doDeleteNode(nodeId);
}
function doDeleteNode(nodeId) {
  var wf = getActiveWorkflow();
  if (!wf) return;
  var mainNode = ensureMainNode(wf);
  if (isMainNode(wf, nodeId)) {
    selectedNodeId = mainNode ? mainNode.id : null;
    showToast('主节点是流程锚点，不能删除', 'warning');
    return;
  }
  const parent = findParent(wf.tree, nodeId);
  if (!parent) return;
  const idx = parent.children.findIndex(c => c.id === nodeId);
  if (idx !== -1) parent.children.splice(idx, 1);
  if (selectedNodeId === nodeId) selectedNodeId = wf.tree.children.length ? wf.tree.children[0].id : null;
  saveState();
  renderAll();
}

function removeNodeFromParent(root, nodeId) {
  if (!root) return null;
  for (let i = 0; i < root.children.length; i++) {
    if (root.children[i].id === nodeId) {
      if (root.children[i]._isMainNode === true) return null;
      return root.children.splice(i, 1)[0];
    }
    const found = removeNodeFromParent(root.children[i], nodeId);
    if (found) return found;
  }
  return null;
}

function moveNodeBefore(nodeId, targetId) {
  var wf = getActiveWorkflow();
  if (!wf) return;
  ensureMainNode(wf);
  if (isMainNode(wf, nodeId)) { showToast('主节点不能移动', 'warning'); return; }
  if (isMainNode(wf, targetId)) { showToast('主节点不能创建同级节点', 'warning'); return; }
  const node = removeNodeFromParent(wf.tree, nodeId);
  if (!node) return;
  const targetParent = findParent(wf.tree, targetId);
  if (!targetParent) { wf.tree.children.push(node); return; }
  const tIdx = targetParent.children.findIndex(c => c.id === targetId);
  targetParent.children.splice(tIdx, 0, node);
  updateParentRefs(node, targetParent.id);
  saveState();
  renderAll();
}

function moveNodeAfter(nodeId, targetId) {
  var wf = getActiveWorkflow();
  if (!wf) return;
  ensureMainNode(wf);
  if (isMainNode(wf, nodeId)) { showToast('主节点不能移动', 'warning'); return; }
  if (isMainNode(wf, targetId)) { showToast('主节点不能创建同级节点', 'warning'); return; }
  const node = removeNodeFromParent(wf.tree, nodeId);
  if (!node) return;
  const targetParent = findParent(wf.tree, targetId);
  if (!targetParent) { wf.tree.children.unshift(node); return; }
  const tIdx = targetParent.children.findIndex(c => c.id === targetId);
  targetParent.children.splice(tIdx + 1, 0, node);
  updateParentRefs(node, targetParent.id);
  saveState();
  renderAll();
}

function moveNodeAsChild(nodeId, targetId) {
  var wf = getActiveWorkflow();
  if (!wf) return;
  ensureMainNode(wf);
  if (isMainNode(wf, nodeId)) { showToast('主节点不能移动', 'warning'); return; }
  const node = removeNodeFromParent(wf.tree, nodeId);
  if (!node) return;
  const target = findNode(wf.tree, targetId);
  if (!target) { wf.tree.children.push(node); return; }
  target.children.push(node);
  updateParentRefs(node, target.id);
  saveState();
  renderAll();
}

function countDescendants(node) {
  let count = 1;
  for (const c of node.children) count += countDescendants(c);
  return count;
}

function dfsNodes(node, acc) {
  acc = acc || [];
  acc.push(node);
  for (const c of node.children) dfsNodes(c, acc);
  return acc;
}

function copyNode(nodeId) {
  var wf = getActiveWorkflow();
  if (!wf) return;
  ensureMainNode(wf);
  const node = findNode(wf.tree, nodeId);
  if (!node) return;
  if (isMainNode(wf, node)) { showToast('主节点不能复制', 'warning'); return; }
  copiedNode = JSON.parse(JSON.stringify(node));
  delete copiedNode.id;
  showToast('节点已复制', 'success');
}

function pasteNode(targetId) {
  if (!copiedNode) { showToast('没有已复制的节点', 'warning'); return; }
  var wf = getActiveWorkflow();
  if (!wf) return;
  const target = findNode(wf.tree, targetId);
  if (!target) { showToast('目标节点不存在', 'error'); return; }
  const newNode = JSON.parse(JSON.stringify(copiedNode));
  newNode.id = 'n' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  newNode.status = 'pending';
  newNode.output = '';
  newNode.error = '';
  (function clearIds(n) {
    n._parentId = target.id;
    for (const c of n.children) clearIds(c);
  })(newNode);
  target.children.push(newNode);
  if (target._collapsed) target._collapsed = false;
  saveState();
  renderAll();
  selectedNodeId = newNode.id;
  renderAll();
  showToast('节点已粘贴', 'success');
}

function toggleNodeLock(id) {
  var wf = getActiveWorkflow();
  if (!wf) return;
  var mainNode = ensureMainNode(wf);
  var n = findNode(wf.tree, id);
  if (!n) return;
  if (isMainNode(wf, n)) {
    mainNode.locked = false;
    showToast('主节点可编辑，删除由结构保护控制', 'info');
    renderAll();
    return;
  }
  n.locked = !n.locked;
  saveState();
  renderAll();
}

// ── SSE execution ──
async function executeNode(nodeId) {
  if (isRunning) { showToast('正在执行中', 'warning'); return; }
  var wf = getActiveWorkflow();
  if (!wf) return;
  const node = findNode(wf.tree, nodeId);
  if (!node) return;
  if (!providerState.apiKey) { showToast('请先设置 API Key', 'warning'); return; }

  isRunning = true;
  abortController = new AbortController();
  node.status = 'running';
  node.output = '';
  node.error = '';
  renderAll();

  try {
    let actualPrompt = node.prompt || '';
    const inputSource = node.inputType;
    if (inputSource === 'manual' && node.manualInput) {
      actualPrompt = node.manualInput + '\n\n' + (node.prompt || '');
    } else if (inputSource === 'inherit' && node.inheritFrom) {
      const ancestor = findNode(wf.tree, node.inheritFrom);
      if (ancestor && ancestor.output) {
        actualPrompt = ancestor.output + '\n\n' + (node.prompt || '');
      }
    }

    const p = PROVIDERS[providerState.provider];
    if (!p) throw new Error('不支持的 Provider');

    const model = providerState.model || '';
    const url = p.getUrl ? p.getUrl(model, providerState.apiKey) : p.endpoint;
    const headers = p.buildHeaders(providerState.apiKey);
    const body = p.buildBody(model, actualPrompt || 'Hello', node.maxTokens, node.temperature);
    const parseFn = p.parse;

    const response = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: abortController.signal
    });

    if (!response.ok) {
      const errText = await response.text().catch(() => '');
      throw new Error('HTTP ' + response.status + (errText ? ': ' + errText.slice(0,200) : ''));
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let accumulated = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n');
      buf = parts.pop() || '';
      for (const line of parts) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]' || payload === '[done]') continue;
        try {
          const parsed = JSON.parse(payload);
          const text = parseFn(parsed);
          if (text) {
            accumulated += text;
            node.output = accumulated;
            updateOutputDisplay(nodeId);
          }
        } catch(e) { /* skip malformed */ }
      }
    }

    node.status = 'done';
  } catch (err) {
    if (err.name === 'AbortError') {
      const n = findNode(wf.tree, nodeId);
      if (n) n.status = 'done';
    } else {
      const n = findNode(wf.tree, nodeId);
      if (n) { n.status = 'error'; n.error = err.message; }
    }
  } finally {
    isRunning = false;
    abortController = null;
    saveState();
    renderAll();
  }
}

async function executeAll(nodeId) {
  if (isRunning) { showToast('正在执行中', 'warning'); return; }
  var wf = getActiveWorkflow();
  if (!wf) return;
  const node = findNode(wf.tree, nodeId);
  if (!node) return;
  if (!providerState.apiKey) { showToast('请先设置 API Key', 'warning'); return; }

  const allNodes = dfsNodes(node);
  runQueue = allNodes.map(n => n.id);
  runIndex = 0;

  for (const nid of runQueue) {
    const n = findNode(wf.tree, nid);
    if (!n) continue;
    n.status = 'pending';
    n.output = '';
    n.error = '';
  }
  renderAll();
  updateBottomBar();

  for (let i = 0; i < runQueue.length; i++) {
    if (abortController?.signal.aborted) break;
    runIndex = i;
    const nid = runQueue[i];
    const n = findNode(wf.tree, nid);
    if (!n) continue;

    let actualPrompt = n.prompt || '';
    const inputSource = n.inputType;
    if (inputSource === 'manual' && n.manualInput) {
      actualPrompt = n.manualInput + '\n\n' + (n.prompt || '');
    } else if (inputSource === 'inherit' && n.inheritFrom) {
      const ancestor = findNode(wf.tree, n.inheritFrom);
      if (ancestor && ancestor.output) {
        actualPrompt = ancestor.output + '\n\n' + (n.prompt || '');
      }
    }

    n.status = 'running';
    n.output = '';
    n.error = '';
    selectedNodeId = nid;
    renderAll();
    updateBottomBar();

    try {
      const p = PROVIDERS[providerState.provider];
      const model = providerState.model || '';
      const url = p.getUrl ? p.getUrl(model, providerState.apiKey) : p.endpoint;
      const headers = p.buildHeaders(providerState.apiKey);
      const body = p.buildBody(model, actualPrompt || 'Hello', n.maxTokens, n.temperature);
      const parseFn = p.parse;

      const response = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify(body),
        signal: abortController.signal
      });

      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error('HTTP ' + response.status + (errText ? ': ' + errText.slice(0,200) : ''));
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let accumulated = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n');
        buf = parts.pop() || '';
        for (const line of parts) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]' || payload === '[done]') continue;
          try {
            const parsed = JSON.parse(payload);
            const text = parseFn(parsed);
            if (text) {
              accumulated += text;
              n.output = accumulated;
              updateOutputDisplay(nid);
            }
          } catch(e) {}
        }
      }

      n.status = 'done';
    } catch (err) {
      if (err.name === 'AbortError') {
        n.status = 'done';
      } else {
        n.status = 'error';
        n.error = err.message;
      }
    }
    saveState();
    renderAll();
    updateBottomBar();
  }

  abortController = null;
  saveState();
  updateBottomBar();
}

function stopExecution() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
}

function updateOutputDisplay(nodeId) {

function updateBottomBar() {
  const el = document.getElementById('bottomBar');

    el.textContent = '⏳ 执行中: ' + (runIndex + 1) + '/' + runQueue.length;
  } else {
    runQueue = [];
    runIndex = 0;
    el.textContent = '';
  }
}

  isRunning = true;
  abortController = new AbortController();
  var queue=buildQueue(node);
  if(queue.length===0){showToast('没有待执行的节点','info');return;}
  document.getElementById('execProgress').style.display='block';
  updateProgress(0,queue.length,'');
  runQueue=queue.map(function(n){return n.id});
  runIndex=0;
  queue.forEach(function(n){n.status='pending';n.output='';n.error='';});
  renderAll();
  for(var i=0;i<queue.length;i++){
    if(abortController&&abortController.signal.aborted)break;
    runIndex=i;
    var n=queue[i];
    var nid=n.id;
    var actualPrompt=n.prompt||'';
    if(n.inputType==='manual'&&n.manualInput){
      actualPrompt=n.manualInput+'\n\n'+(n.prompt||'');
    }else if(n.inputType==='inherit'&&n.inheritFrom){
      var ancestor=findNode(wf.tree,n.inheritFrom);
      if(ancestor&&ancestor.output)actualPrompt=ancestor.output+'\n\n'+(n.prompt||'');
    }
    n.status='running';n.output='';n.error='';
    selectedNodeId=nid;
    renderAll();
    updateProgress(i,queue.length,n.title||'未命名');
    try{
      var p=PROVIDERS[providerState.provider];
      var model=providerState.model||'';
      var url=p.getUrl?p.getUrl(model,providerState.apiKey):p.endpoint;
      var headers=p.buildHeaders(providerState.apiKey);
      var body=p.buildBody(model,actualPrompt||'Hello',n.maxTokens,n.temperature);
      var parseFn=p.parse;
      var response=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:abortController.signal});
      if(!response.ok){
        var errText=await response.text().catch(function(){return'';});
        throw new Error('HTTP '+response.status+(errText?': '+errText.slice(0,200):''));
      }
      var reader=response.body.getReader();
      var decoder=new TextDecoder();
      var buf='',accumulated='';
      while(true){
        var r=await reader.read();
        if(r.done)break;
        buf+=decoder.decode(r.value,{stream:true});
        var parts=buf.split('\n');
        buf=parts.pop()||'';
        for(var j=0;j<parts.length;j++){
          var line=parts[j];
          if(!line.startsWith('data: '))continue;
          var payload=line.slice(5).trim();
          if(payload==='[DONE]'||payload==='[done]')continue;
          try{
            var parsed=JSON.parse(payload);
            var text=parseFn(parsed);
            if(text){accumulated+=text;n.output=accumulated;updateOutputDisplay(nid);}
          }catch(e){}
        }
      }
      n.status='done';
    }catch(err){
      if(err.name==='AbortError'){n.status='done';}else{n.status='error';n.error=err.message;}
    }
    saveState();
    renderAll();
    updateProgress(i+1,queue.length,'');
  }
  isRunning = false;
  abortController=null;
  saveState();
  updateProgress(queue.length,queue.length,'');
  setTimeout(function(){var el=document.getElementById('execProgress');if(el)el.style.display='none';},2000);
  updateBottomBar();
}

// ── Toast ──
function showConfirm(msg, cb) {
  var o=document.getElementById('confirmOverlay'),m=document.getElementById('confirmMsg');
  m.textContent=msg;o.style.display='flex';
  var y=document.getElementById('confirmYes'),n=document.getElementById('confirmNo');
  function cl(){o.style.display='none';y.removeEventListener('click',onY);n.removeEventListener('click',cl);}
  function onY(){cl();cb();}
  y.addEventListener('click',onY);n.addEventListener('click',cl);
}

function showToast(msg, type) {
  type = type || 'info';
  const container = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  container.appendChild(t);
  setTimeout(() => {
    t.classList.add('removing');
    setTimeout(() => t.remove(), 260);
  }, 3000);
}

});

document.getElementById('contextMenu').addEventListener('click', function(e) {
  const item = e.target.closest('.ctx-item');
  if (!item) return;
  const nodeId = item.dataset.id;
  const action = item.dataset.action;
  var wf = getActiveWorkflow();
  var ctxNode = wf ? findNode(wf.tree, nodeId) : null;
  if (action === 'ctxCopy') { copyNode(nodeId); }
  else if (action === 'ctxPaste') { pasteNode(nodeId); }

  }

});

function getStatusText(status) {
  const m = { pending: '⏳ 待执行', running: '🔄 执行中', done: '✅ 完成', error: '❌ 错误' };
  return m[status] || '⏳ 待执行';
}

function saveCurrentNodeEdit() {
  var wf = getActiveWorkflow();
  const node = wf && selectedNodeId ? findNode(wf.tree, selectedNodeId) : null;
  if (!node) return;
  const inp = document.getElementById('inpTitle');
  if (inp) node.title = inp.value;
  const sel = document.getElementById('selInputType');
  if (sel) node.inputType = sel.value;
  const mi = document.getElementById('inpManualInput');
  if (mi) node.manualInput = mi.value;
  const si = document.getElementById('selInheritFrom');
  if (si) node.inheritFrom = si.value || null;
  const pr = document.getElementById('inpPrompt');
  if (pr) node.prompt = pr.value;
  const mt = document.getElementById('inpMaxTokens');
  if (mt) node.maxTokens = parseInt(mt.value) || 4000;
  const tp = document.getElementById('inpTemperature');
  if (tp) node.temperature = parseFloat(tp.value) || 0.3;
  saveState();
}

function renderTree() {
  try{
  const container = document.getElementById('treeContainer');
  var wf = getActiveWorkflow();
  if (!container) { console.error('treeContainer not found!'); return; }
  if (!wf) { container.innerHTML = '<div style="color:var(--text2);padding:20px;font-size:12px">暂无数据</div>'; return; }
  var topNode = ensureMainNode(wf);
  // Render only the protected main node as root of the visible tree, skipping the invisible 流程根节点
  if(topNode){
    container.innerHTML = '<div class="tree"><ul>' + renderNode(topNode, 0) + '</ul></div>';
  } else {
    container.innerHTML = '<div style="color:var(--text2);padding:20px;font-size:12px">加载中...</div>';
  }
  }catch(e){console.error('renderTree error:',e);var c=document.getElementById('treeContainer');if(c)c.innerHTML='<div style="color:#ff6b9d;padding:20px;font-size:13px">⚠️ 渲染异常: '+e.message+'</div>';}
}

function renderNode(node, depth) {
  var wf = getActiveWorkflow();
  let path = wf ? getNodePath(wf.tree, node.id) : '';
  let sel = node.id === selectedNodeId ? ' selected' : '';
  let col = node.color ? ' color-' + node.color : '';
  let lok = node.locked ? ' locked' : '';
  let stat = node.status || 'pending';
  let html = '<li>';
  html += '<div class="t-node' + sel + col + lok + '" data-id="' + node.id + '">';
  html += '<span class="node-drag">⠿</span>';
  html += '<span class="node-num">' + (path ? path + '级' : '') + '</span>';
  html += '<span class="node-title">' + esc(node.title || '新节点') + '</span>';
  if(node.locked) html += '<span style="font-size:9px;color:var(--text2)">🔒</span>';
  html += '<span class="node-status ' + stat + '"></span>';
  html += '</div>';
  if (node.children && node.children.length > 0) {
    html += '<ul>';
    node.children.forEach(function(c) { html += renderNode(c, depth + 1); });
    html += '</ul>';
  }
  html += '</li>';
  return html;
}

  saveState();
  activeWorkflowId = id;
  selectedNodeId = null;
  var wf = getActiveWorkflow();
  if(wf){
    var mainNode = ensureMainNode(wf);
    if(!selectedNodeId||!findNode(wf.tree,selectedNodeId)){
      selectedNodeId=mainNode?mainNode.id:null;
    }
  }
  saveState();
  renderWorkflowList();
  renderAll();
  updateWfNameInput();
}

function deleteWorkflow(id){
  showConfirm('确定删除此流程吗？', function(){
    workflows = workflows.filter(w => w.id !== id);
    if(workflows.length === 0){
      newWorkflow();
      return;
    }
    if(activeWorkflowId === id) activeWorkflowId = workflows[0].id;
    saveState();
    renderWorkflowList();
    switchWorkflow(activeWorkflowId);
  });
}

function newWorkflow(){
  var wf = {
    id: 'wf_' + Date.now(),
    title: '新流程 ' + (workflows.length + 1),
    tree: createNode('流程根节点'),
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  var mainNode=createNode('主任务');mainNode.locked=false;mainNode._isMainNode=true;mainNode._parentId=wf.tree.id;
  wf.tree.children.push(mainNode);
  workflows.push(wf);
  activeWorkflowId = wf.id;
  selectedNodeId = wf.tree.children[0].id;
  saveState();
  renderWorkflowList();
  renderAll();
  updateWfNameInput();
}

function updateWfNameInput(){
  var inp = document.getElementById('wfNameInput');
  var wf = getActiveWorkflow();
  if(inp && wf && inp !== document.activeElement) inp.value = wf.title;
}

// ── Persistence ──
function saveState() {
  try {
    workflows = normalizeWorkflowList(workflows);
    if (activeWorkflowId && !workflows.some(function(wf) { return wf.id === activeWorkflowId; })) {
      activeWorkflowId = workflows.length ? workflows[0].id : null;
    }
    var activeWf = getActiveWorkflow();
    if (activeWf && (!selectedNodeId || !findNode(activeWf.tree, selectedNodeId))) {
      var fallbackMain = ensureMainNode(activeWf);
      selectedNodeId = fallbackMain ? fallbackMain.id : null;
    }
    localStorage.setItem('wf_list', JSON.stringify(workflows));
    localStorage.setItem('wf_active', activeWorkflowId || '');
    localStorage.setItem('wf_provider', JSON.stringify(providerState));
    if (selectedNodeId) localStorage.setItem('wf_selected', selectedNodeId);
    else localStorage.removeItem('wf_selected');
    return true;
  } catch(e) {
    console.error('保存流程失败:', e);
    if (document.getElementById('toastContainer')) showToast('保存失败: ' + e.message, 'error');
    return false;
  }
}

function loadState() {
  try {
    const list = localStorage.getItem('wf_list');
    workflows = normalizeWorkflowList(parseStoredJson(list, [], '流程数据', 'wf_list_corrupt_backup'));

    if (workflows.length === 0) {
      var wf = {
        id: 'wf_' + Date.now(),
        title: '未命名流程',
        tree: createNode('流程根节点'),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      var mn3=createNode('主任务');mn3.locked=false;mn3._isMainNode=true;mn3._parentId=wf.tree.id;wf.tree.children.push(mn3);
      workflows.push(normalizeWorkflowData(wf, 0));
    }

    activeWorkflowId = localStorage.getItem('wf_active') || workflows[0].id;
    if (!workflows.some(function(wf) { return wf.id === activeWorkflowId; })) {
      activeWorkflowId = workflows[0].id;
    }

    const prov = parseStoredJson(localStorage.getItem('wf_provider'), null, 'Provider 设置');
    if (prov && typeof prov === 'object' && !Array.isArray(prov)) {
      if (typeof prov.provider === 'string' && prov.provider) providerState.provider = prov.provider;
      if (typeof prov.model === 'string') providerState.model = prov.model;
      if (typeof prov.apiKey === 'string') providerState.apiKey = prov.apiKey;
    }

    const dp49 = localStorage.getItem('dp49');
    const dk30 = localStorage.getItem('dk30');
    if (dp49) {
      try { providerState.apiKey = atob(dp49); } catch(e) { providerState.apiKey = dk30 || providerState.apiKey || ''; }
    } else if (dk30) {
      providerState.apiKey = dk30;
    }

    selectedNodeId = localStorage.getItem('wf_selected') || null;
    var activeWf = getActiveWorkflow();
    if (activeWf && (!selectedNodeId || !findNode(activeWf.tree, selectedNodeId))) {
      var loadedMainNode = ensureMainNode(activeWf);
      selectedNodeId = loadedMainNode ? loadedMainNode.id : null;
    }
    saveState();
  } catch(e) {
    console.error('加载流程失败:', e);
    var wf = {
      id: 'wf_' + Date.now(),
      title: '未命名流程',
      tree: createNode('流程根节点'),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    var mn4=createNode('主任务');mn4.locked=false;mn4._isMainNode=true;mn4._parentId=wf.tree.id;wf.tree.children.push(mn4);
    workflows = [normalizeWorkflowData(wf, 0)];
    activeWorkflowId = wf.id;
    selectedNodeId = wf.tree.children[0].id;
    saveState();
  }
}

// ── Theme ──
document.getElementById('themeToggle').addEventListener('click', function(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  this.textContent = dark ? '🌙 暗色模式' : '☀️ 亮色模式';
  localStorage.setItem('wf_theme', dark ? 'light' : 'dark');
});

(function() {
  const saved = localStorage.getItem('wf_theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeToggle').textContent = '☀️ 亮色模式';
  }
})();

// ── Collapse ──
function updateBtnPos(){
  const pl=document.getElementById('panelLeft'),pr=document.getElementById('panelRight');
  const bl=document.getElementById('collapseBtnLeft'),br=document.getElementById('collapseBtnRight');
  bl.style.left=(pl.classList.contains('collapsed')?0:pl.offsetWidth)+'px';
  br.style.right=(pr.classList.contains('collapsed')?0:pr.offsetWidth)+'px';
}
// ── Nav collapse ──
(function(){
  var h=document.getElementById('navHeader'),b=document.getElementById('navBody'),a=document.getElementById('navArrow');
  if(h)h.addEventListener('click',function(){var d=b.style.display==='none';b.style.display=d?'':'none';a.textContent=d?'▼':'▶';});
})();
// ── Workflow list collapse ──
(function(){
  var h=document.getElementById('wfListHeader'),b=document.getElementById('wfListBody'),a=document.getElementById('wfListArrow');
  if(h)h.addEventListener('click',function(){var d=b.style.display==='none';b.style.display=d?'':'none';a.textContent=d?'▼':'▶';});
})();
// ── Workflow name ──
document.getElementById('wfNameInput').addEventListener('input', function(){
  var wf = getActiveWorkflow();
  if(wf){wf.title = this.value; wf.updatedAt = new Date().toISOString(); saveState(); renderWorkflowList();}
});

var _animFrame=null,_leftW=260,_rightW=380;
function animateBtnPos(){
  updateBtnPos();
  _animFrame=requestAnimationFrame(animateBtnPos);
}
function togglePanel(side){
  const pl=document.getElementById('panelLeft'),pr=document.getElementById('panelRight');
  const p=side==='left'?pl:pr;
  const isCollapsed=p.classList.contains('collapsed');
  if(isCollapsed){
    p.classList.remove('collapsed');
    p.style.width=(side==='left'?_leftW:_rightW)+'px';
    p.style.minWidth=(side==='left'?_leftW:_rightW)+'px';
  }else{
    if(side==='left')_leftW=p.offsetWidth;else _rightW=p.offsetWidth;
    p.style.width='0px';p.style.minWidth='0px';
    p.classList.add('collapsed');
  }
  if(_animFrame)cancelAnimationFrame(_animFrame);
  animateBtnPos();
  setTimeout(function(){cancelAnimationFrame(_animFrame);_animFrame=null;updateBtnPos();},360);
}
document.getElementById('collapseBtnLeft').addEventListener('click',function(){togglePanel('left')});
document.getElementById('collapseBtnRight').addEventListener('click',function(){togglePanel('right')});

// ── Resize ──
(function(){
  const rh=document.getElementById('resizeHandle'),pr=document.getElementById('panelRight');
  let d=false,sx=0,sw=0;
  rh.addEventListener('mousedown',function(e){d=true;sx=e.clientX;sw=pr.offsetWidth;pr.classList.add('dragging');e.preventDefault()});
  document.addEventListener('mousemove',function(e){
    if(!d)return;
    const w=Math.max(180,Math.min(800,sw+sx-e.clientX));
    pr.style.width=w+'px';pr.style.minWidth=w+'px';
    _rightW=w;localStorage.setItem('layout_right_w',w);
    updateBtnPos();
  });
  document.addEventListener('mouseup',function(){if(d){d=false;pr.classList.remove('dragging')}});
})();

// ── Tree buttons ──
// ── Event delegation for tree buttons and workflow list ──
document.getElementById('treeButtons').addEventListener('click', function(e) {
  var btn = e.target.closest('.btn[data-action]');
  if (!btn) return;
  e.stopPropagation();
  var action = btn.dataset.action;
  if (action === 'addChild') {
    var wfa = getActiveWorkflow();
    if (!wfa) { showToast('请先创建一个流程', 'warning'); return; }
    if (!selectedNodeId || !findNode(wfa.tree, selectedNodeId)) {
      if (wfa.tree.children.length > 0) {
        selectedNodeId = wfa.tree.children[0].id;
      } else {
        showToast('请先选择一个节点', 'warning'); return;
      }
    }
    var nid = addChild(selectedNodeId);
    if (nid) selectedNodeId = nid;
    renderAll();
    } else if (action === 'deleteNode') {
      if (!selectedNodeId) { showToast('请先选择一个节点', 'warning'); return; }
      var wf = getActiveWorkflow();
      if (wf && selectedNodeId === wf.tree.id) { showToast('不能删除根节点', 'warning'); return; }
      if (wf) ensureMainNode(wf);
      if (wf && isMainNode(wf, selectedNodeId)) { showToast('主节点是流程锚点，不能删除', 'warning'); return; }
      var delNode = wf ? findNode(wf.tree, selectedNodeId) : null;
      if (delNode && delNode.locked) { showToast('锁定节点不能删除', 'warning'); return; }
      deleteNode(selectedNodeId);
  } else if (action === 'copyNode') {
    if (!selectedNodeId) { showToast('请先选择一个节点', 'warning'); return; }
    copyNode(selectedNodeId);
  } else if (action === 'pasteNode') {
    if (!selectedNodeId) { showToast('请先选择一个节点', 'warning'); return; }
    pasteNode(selectedNodeId);
  }
});
// ── Event delegation for workflow list ──
document.getElementById('wfListContainer').addEventListener('click', function(e) {
  var item = e.target.closest('.wf-item');
  if (!item) return;
  if (e.target.closest('.wf-del')) {
    deleteWorkflow(item.dataset.id);
    return;
  }
  switchWorkflow(item.dataset.id);
});

// ── Init ──
_leftW=parseInt(localStorage.getItem('layout_left_w'))||260;
_rightW=parseInt(localStorage.getItem('layout_right_w'))||380;
document.getElementById('panelLeft').style.width=_leftW+'px';document.getElementById('panelLeft').style.minWidth=_leftW+'px';
document.getElementById('panelRight').style.width=_rightW+'px';document.getElementById('panelRight').style.minWidth=_rightW+'px';

// Load persisted workflows before the first render. Never clear user data during startup.
loadState();
renderWorkflowList();
var btnWf=document.getElementById('btnNewWorkflow');
if(btnWf)btnWf.addEventListener('click',newWorkflow);
updateBtnPos();
try{renderAll();}catch(e){console.error('renderAll',e);}
window.addEventListener('resize',updateBtnPos);
window.addEventListener('beforeunload', function() {
  saveCurrentNodeEdit();
  saveState();
});

// Handle keyboard copy/paste
document.addEventListener('keydown', function(e) {
  var tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
    if (selectedNodeId) { copyNode(selectedNodeId); e.preventDefault(); }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
    if (selectedNodeId) { pasteNode(selectedNodeId); e.preventDefault(); }
  }
});
</script>
